<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to Mozilla-Campus-Club-of-SLIIT</title>
    <style>
        body,
        table,
        td,
        a {
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }

        a {
            text-decoration: none;
        }

        table,
        td {
            mso-table-lspace: 0pt;
            mso-table-rspace: 0pt;
        }

        img {
            -ms-interpolation-mode: bicubic;
            border: 0;
            outline: none;
            text-decoration: none;
        }

        a {
            text-decoration: none;
        }

        @media screen and (max-width: 620px) {
            table[class="container"] {
                width: 95% !important;
            }

            td[class="body-padding"] {
                padding: 15px !important;
            }

            h1 {
                font-size: 20px !important;
            }

            a[class="button"] {
                width: 100% !important;
                padding: 10px 0 !important;
                font-size: 16px !important;
            }
        }
    </style>
</head>

<body style="
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
    ">
    <!-- Main Container -->
    <table width="100%" border="0" cellspacing="0" cellpadding="0" bgcolor="#f5f5f5">
        <tr>
            <td align="center" style="padding: 30px 15px">
                <!-- Email content -->
                <table class="container" width="600" border="0" cellspacing="0" cellpadding="0" style="
              max-width: 600px;
              background-color: #ffffff;
              border-radius: 8px;
              overflow: hidden;
            ">
                    <!-- Header -->
                    <tr>
                        <td style="
                  background: #ff6600;
                  padding: 1rem;
                  text-align: center;
                  border-radius: 8px 8px 0 0;
                ">
                            <table width="100%" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td align="center">
                                        <div style="
                          width: 5rem;
                          height: 5rem;
                          background-color: #ffffff;
                          border-radius: 50%;
                          text-align: center;
                          line-height: 5rem;
                          margin: 0 auto;
                        ">
                                            <span style="font-size: 40px">🦊</span>
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <td align="center">
                                        <h1 style="
                          margin-top: 0.5em;
                          color: #ffffff;
                          font-size: 32px;
                          font-weight: 700;
                          letter-spacing: -0.5px;
                        ">
                                            Welcome to Mozilla Club!
                                        </h1>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Body -->
                    <tr>
                        <td style="padding: 20px 0 0 20px; text-align: left">
                            <p style="
                    color: #333333;
                    font-size: 18px;
                    line-height: 1.4;
                    font-size: 15px;
                  ">
                                Hi {{ first_name }},
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 40px; text-align: center">
                            <!-- Content -->
                            <p style="
                    margin: 0 0 30px;
                    color: #3e3e3e;
                    font-size: 18px;
                    line-height: 1.4;
                    font-size: 15px;
                  ">
                                Thanks for subscribing! Get ready for exclusive updates,
                                community events, and resources to help you champion the open
                                web.
                            </p>

                            <!-- CTA -->
                            <table cellpadding="0" cellspacing="0" border="0" align="center">
                                <tr>
                                    <td align="center" style="background-color: #ff6600; border-radius: 8px">
                                        <a href="https://www.sliitmozilla.org/" target="_blank" style="
                          display: inline-block;
                          padding: 15px 20px;
                          color: #ffffff;
                          text-decoration: none;
                          font-size: 15px;
                          font-weight: 600;
                          letter-spacing: 0.5px;
                        ">Explore Mozilla Club</a>
                                    </td>
                                </tr>
                            </table>
                            <!-- social media links -->
                            <table style="margin-top: 4rem" cellpadding="0" cellspacing="0" border="0" align="center">
                                <tr>
                                    <td style="padding-top: 10px; outline: none; text-decoration: none;">
                                        <!-- fb -->
                                        <a href="https://www.facebook.com/sliitmozilla">
                                            <img src="https://raw.githubusercontent.com/Thamidu-Nadun/email-templates/refs/heads/main/assets/img/facebook.jpg"
                                                alt="facebook" width="15" height="15"
                                                style="color: #ff6600; padding: 0 4px" />
                                        </a>
                                        <!-- instagram -->
                                        <a href="https://www.instagram.com/sliitmozilla">
                                            <img src="https://raw.githubusercontent.com/Thamidu-Nadun/email-templates/refs/heads/main/assets/img/instagram.jpg"
                                                alt="instagram" width="15" height="15"
                                                style="color: #ff6600; padding: 0 4px" />
                                        </a>
                                        <!-- github -->
                                        <a href="https://github.com/Mozilla-Campus-Club-of-SLIIT">
                                            <img src="https://raw.githubusercontent.com/Thamidu-Nadun/email-templates/refs/heads/main/assets/img/github.jpg"
                                                alt="github" width="15" height="15"
                                                style="color: #ff6600; padding: 0 4px" />
                                        </a>
                                        <!-- youtube -->
                                        <a href="https://www.youtube.com/@sliitmozilla">
                                            <img src="https://raw.githubusercontent.com/Thamidu-Nadun/email-templates/refs/heads/main/assets/img/youtube.jpg"
                                                alt="youtube" width="15" height="15"
                                                style="color: #ff6600; padding: 0 4px" />
                                        </a>
                                        <!-- linkedin -->
                                        <a href="https://www.linkedin.com/company/sliitmozilla/">
                                            <img src="https://raw.githubusercontent.com/Thamidu-Nadun/email-templates/refs/heads/main/assets/img/linkedin.jpg"
                                                alt="linkedin" width="15" height="15"
                                                style="color: #ff6600; padding: 0 4px" />
                                        </a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td align="center"
                            style="padding: 40px; background-color: #f0f0f0; font-size: 12px; color: #777777;">
                            <p>
                                &copy; 2025
                                <a href="https://www.sliitmozilla.org/" target="_blank"
                                    style="color: #777777; text-decoration: underline">Mozilla-Campus-Club-of-SLIIT</a>.
                                All rights reserved.
                            </p>
                            <p style="margin: 5px 0 0 0">
                                <a href="{{ unsubscribe_link }}" target="_blank"
                                    style=" color: #ff6600; font-family: Arial, Helvetica, sans-serif; font-size: 12px; text-decoration: underline; ">
                                    Unsubscribe
                                </a>
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
